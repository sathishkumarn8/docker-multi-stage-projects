# Docker Compose base configuration
# This file defines the core services and configuration
# Use with docker-compose.dev.yml or docker-compose.prod.yml

version: '3.8'

services:
  # ========================================================================
  # Application Service
  # ========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Build arguments for customization
      args:
        - NODE_ENV=production
    image: docker-multi-stage-projects:latest
    container_name: app-container
    
    # Networking
    networks:
      - app-network
    
    # Environment variables
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${APP_PORT:-3000}
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-app_db}
      REDIS_URL: redis://cache:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
    
    # Dependencies
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    
    # Restart policy
    restart: unless-stopped
  
  # ========================================================================
  # PostgreSQL Database Service
  # ========================================================================
  db:
    image: postgres:15-alpine
    container_name: db-container
    
    # Networking
    networks:
      - app-network
    
    # Environment variables
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-app_db}
    
    # Volume for data persistence
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # Restart policy
    restart: unless-stopped
  
  # ========================================================================
  # Redis Cache Service
  # ========================================================================
  cache:
    image: redis:7-alpine
    container_name: cache-container
    
    # Networking
    networks:
      - app-network
    
    # Command
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis-password}
    
    # Volume for data persistence
    volumes:
      - redis-data:/data
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # Restart policy
    restart: unless-stopped

# ============================================================================
# Networks
# ============================================================================
networks:
  app-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
