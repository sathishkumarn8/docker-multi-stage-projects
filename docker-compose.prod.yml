  #     - app-network
  #   depends_on:
  #     - elasticsearch
  #   environment:
  #     - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
  #   restart: always

# Note: Volumes and networks are inherited from docker-compose.yml
